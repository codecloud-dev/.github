name: "💡 功能建议"
description: 想加个功能、改个行为，或提个改进
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。不要求写得很正式，说清「想解决什么问题」就够了。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题【必填】
      description: 先说场景和痛点，再说你想要的方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你期望的做法【选填】
      description: 有草图 / 伪代码 / 别的项目怎么做的，都可以贴
  - type: textarea
    id: alt
    attributes:
      label: 考虑过的替代方案【选填】
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue / 讨论
          required: true
        - label: 我愿意参与实现或帮忙测试（不勾也完全没问题）
          required: false
